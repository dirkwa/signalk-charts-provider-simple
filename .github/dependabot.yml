version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    # release-please.yml reads the scope: a `deps` bump ships, `deps-dev` does not.
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track the Node.js major. Keep this pinned
      # to the lowest supported runtime (Node 22 per package.json engines)
      # so types reflect what's actually available on every supported version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # An action bump changes nothing users get, so it is not a build(deps) one.
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
