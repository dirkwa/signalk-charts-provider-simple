version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    # build(deps) is releasable and build(deps-dev) is not; release-please's
    # gate and label-by-title both read the prefix.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track the Node.js major. Keep this pinned
      # to the lowest supported runtime (Node 22 per package.json engines)
      # so types reflect what's actually available on every supported version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
