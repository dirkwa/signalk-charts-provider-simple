name: Publish Package

# Publishes the tag it runs on to npm. Release tags come from release-please
# (merging its release PR creates the tag and the GitHub release, then
# dispatches this workflow on the tag); pre-release tags are pushed by hand,
# and only those get their GitHub release created here.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    # A dispatch can name any ref; only a release tag is published.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          if [[ "${{ github.ref }}" == refs/tags/*-beta.* ]] || [[ "${{ github.ref }}" == refs/tags/*-rc.* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
