name: release-please

on:
  push:
    branches: [main]
  # The gate below runs release-please only for a push that carries a commit
  # users get, so a release pull request it has already opened is not
  # refreshed by a docs or ci merge — and a config change is exactly such a
  # merge. This trigger re-runs it on demand, which is what rewrites an
  # outstanding release pull request against the current configuration.
  workflow_dispatch:

permissions: {}

# One release-please run at a time: a push and a manual run, or two pushes
# landing close together, would each read the release pull request's state
# and each write it, and the later write could undo the earlier one.
# cancel-in-progress is false so a run already creating a tag or dispatching
# the publish is never killed part-way. A run waiting behind it can still be
# replaced by a newer one — the default queue holds a single pending run —
# which costs nothing here: release-please derives the release pull request
# from the commit range, so the newest run produces the same result the
# superseded one would have.
#
# The group is a constant rather than keyed on github.ref: the action is
# given no target-branch, so every run — including a dispatch launched from
# some other branch — acts on the default branch's release pull request. A
# ref-keyed group would put such a run in a group of its own and let it edit
# that pull request alongside a main run.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # GitHub's release notes are never empty, so release-please would propose
  # a release after every merge, a docs or ci change included. Only a push
  # carrying a change users get — or the merge of the release PR itself,
  # which is what creates the tag — goes on to it. The subject is each
  # message's first line; a breaking change counts whatever its type, a
  # dependency bump when it is a runtime one (dependabot scopes those
  # `deps`, dev ones `deps-dev`), and a revert because what it undoes has
  # shipped. The release PR's own title is pull-request-title-pattern in
  # release-please-config.json. The payload holds at most 2048 commits, so a
  # push that fills it may hide more and is let through.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      # A manual run carries no commits to judge, and asking for one is the
      # statement that it should happen — so it bypasses the check below
      # rather than being skipped by it for having an empty payload.
      - id: check
        env:
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          RELEASABLE: '^((feat|fix|perf|revert)(\([^)]*\))?!?: |[a-z]+(\([^)]*\))?!: |build\(deps\): |Revert |chore(\([^)]*\))?: release v?[0-9])'
        run: |
          if [ "$DISPATCHED" = true ]; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            echo "Run requested manually; release-please not gated."
            exit 0
          fi
          if jq -e --arg re "$RELEASABLE" '(length >= 2048) or ([.[] | (split("\n")[0] | test($re)) or test("\nBREAKING[- ]CHANGE: ")] | any)' <<< "$MESSAGES" > /dev/null; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commit in this push; release-please not run."
          fi

  release-please:
    needs: gate
    if: ${{ needs.gate.outputs.releasable == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  # The tag release-please just pushed does not start publish.yml by itself:
  # an event raised with GITHUB_TOKEN starts no workflow, with
  # workflow_dispatch as the exception. So publish.yml is dispatched on the
  # tag — it has to stay the file that publishes, since npm's trusted
  # publishing is bound to that workflow file. Its own job, so that the
  # right to start workflows is held by nothing but this one command.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "${{ needs.release-please.outputs.tag_name }}"
