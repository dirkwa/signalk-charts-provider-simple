name: label-by-title

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions: {}

# One run per pull request at a time: two overlapping runs would each read
# the labels, then each edit, and could leave two managed labels behind.
concurrency:
  group: label-by-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # release.yml sorts the release notes by label, and a pull request opened
  # from the command line carries none. The label follows the title's
  # conventional-commit type. Only the title is read — no checkout, nothing
  # from the pull request runs here — which is what makes pull_request_target
  # safe to use, and what lets a pull request from a fork be labelled.
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The labels this workflow owns: one of them at a time, so a title
          # edited from feat to fix swaps the label rather than adding one.
          # `dependencies` is dependabot's; it is added for a runtime bump
          # opened by hand and never removed. A dev bump keeps it and gets
          # skip-changelog on top — release.yml's exclude wins over its
          # categories.
          managed="enhancement bug skip-changelog"
          conventional='^([a-z]+)(\(([^)]*)\))?!?: '
          type=""; scope=""
          if [[ "$TITLE" =~ $conventional ]]; then
            type="${BASH_REMATCH[1]}"; scope="${BASH_REMATCH[3]}"
          fi
          case "$type" in
            feat|perf) wanted=enhancement ;;
            fix) wanted=bug ;;
            ci|test|chore|refactor|style) wanted=skip-changelog ;;
            build) [ "$scope" = deps-dev ] && wanted=skip-changelog || wanted="" ;;
            *) wanted="" ;;
          esac
          current=$(gh pr view "$NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')
          args=()
          for label in $managed; do
            case " $current " in *" $label "*) has=1 ;; *) has=0 ;; esac
            if [ "$label" = "$wanted" ] && [ "$has" = 0 ]; then args+=(--add-label "$label"); fi
            if [ "$label" != "$wanted" ] && [ "$has" = 1 ]; then args+=(--remove-label "$label"); fi
          done
          if [ "$type" = build ] && [ "$scope" = deps ]; then
            case " $current " in *" dependencies "*) ;; *) args+=(--add-label dependencies) ;; esac
          fi
          if [ "${#args[@]}" = 0 ]; then
            echo "#$NUMBER '$TITLE': nothing to change (${wanted:-no managed label})"
          else
            gh pr edit "$NUMBER" --repo "$REPO" "${args[@]}"
            echo "#$NUMBER '$TITLE': ${args[*]}"
          fi
