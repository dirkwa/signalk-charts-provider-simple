# Labels each pull request from its Conventional Commit title, because
# .github/release.yml sorts the release notes by label and a pull request
# opened from the command line carries none. feat and perf go under
# Features, fix and revert under Fixes, a runtime dependency bump under
# Dependencies; ci, test, chore, refactor, style and dev dependency bumps
# stay out of the notes. A breaking change -- `!` after the type, or a
# `BREAKING CHANGE:` line in the description, which becomes the squash
# commit's body -- goes under Breaking whatever its type. GitHub's own
# `Revert "..."` title counts as revert. Any other type (docs, which ships
# in the package's README, or a build change other than a dependency bump)
# lands under Other.
#
# pull_request_target so that a pull request from a fork is labelled too.
# Only the title and description are read, with no checkout and nothing from
# the pull request run here, which is what makes that trigger safe.
name: label-by-title

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  label:
    # `edited` also fires for a base-branch change, which leaves the labels
    # alone.
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.body
    # One run per pull request at a time: two overlapping runs would each read
    # the labels, then each edit, and could leave two managed labels behind.
    # Set on the job, after the condition above, so that a run the condition
    # skips cannot cancel one that edits.
    concurrency:
      group: label-by-title-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Labels live under the issues API, so creating a missing one needs it.
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read the pull request as it is now rather than from the event: runs
          # for two quick edits can start out of order, and the later one must
          # not label from the earlier title.
          pr=$(gh pr view "$NUMBER" --repo "$REPO" --json title,body,labels)
          TITLE=$(jq -r '.title' <<< "$pr")
          BODY=$(jq -r '.body' <<< "$pr")
          labels=$(jq -r '.labels[].name' <<< "$pr")
          # The labels this workflow owns, one of them at a time, so a title
          # edited from feat to fix swaps the label rather than adding one.
          # `dependencies` is dependabot's; it is added for a runtime bump
          # opened by hand and never removed. A dev bump keeps it and gets
          # skip-changelog on top -- release.yml's exclude wins over its
          # categories.
          managed="breaking-change enhancement bug skip-changelog"
          conventional='^([a-z]+)(\(([^)]*)\))?(!?): '
          type=""; scope=""; bang=""
          if [[ "$TITLE" =~ $conventional ]]; then
            type="${BASH_REMATCH[1]}"; scope="${BASH_REMATCH[3]}"; bang="${BASH_REMATCH[4]}"
          elif [[ "$TITLE" == 'Revert "'* ]]; then
            type=revert
          fi
          case "$type" in
            feat|perf) wanted=enhancement ;;
            fix|revert) wanted=bug ;;
            ci|test|chore|refactor|style) wanted=skip-changelog ;;
            build) [ "$scope" = deps-dev ] && wanted=skip-changelog || wanted="" ;;
            *) wanted="" ;;
          esac
          if [ -n "$bang" ] || grep -qE '^BREAKING[ -]CHANGE: ' <<< "$BODY"; then
            wanted=breaking-change
          fi
          args=()
          for label in $managed; do
            if grep -qxF "$label" <<< "$labels"; then has=1; else has=0; fi
            if [ "$label" = "$wanted" ] && [ "$has" = 0 ]; then args+=(--add-label "$label"); fi
            if [ "$label" != "$wanted" ] && [ "$has" = 1 ]; then args+=(--remove-label "$label"); fi
          done
          if [ "$type" = build ] && [ "$scope" = deps ]; then
            grep -qxF dependencies <<< "$labels" || args+=(--add-label dependencies)
          fi
          # `gh pr edit --add-label` fails on a label the repository does not
          # have yet; create it first. It already existing is the usual case.
          for ((i = 0; i < ${#args[@]}; i += 2)); do
            if [ "${args[i]}" = --add-label ]; then
              gh label create "${args[i+1]}" --repo "$REPO" 2>/dev/null || true
            fi
          done
          if [ "${#args[@]}" = 0 ]; then
            echo "#$NUMBER '$TITLE': nothing to change (${wanted:-no managed label})"
          else
            gh pr edit "$NUMBER" --repo "$REPO" "${args[@]}"
            echo "#$NUMBER '$TITLE': ${args[*]}"
          fi
